name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + tests + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 1.98.0
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Superset of the README battery's test lines: covers
      # `cargo test --workspace`, `cargo test -p formars --all-features`
      # (facade probes/doctests), and the derive trybuild UI suite
      # (dev-dependency, compiled under all-features).
      #
      # SNAPSHOT AUTHORITY: trybuild snapshot stderr (diagnostic wording,
      # spans, help blocks) is rustc-version-sensitive. The pinned gate
      # toolchain 1.98.0 above is the SOLE authority for `.stderr` truth.
      # Snapshots regenerate via `TRYBUILD=overwrite cargo test -p
      # formars-derive --test ui` ONLY on that pinned gate toolchain 1.98.0,
      # every diff hand-reviewed, committed atomically with any version
      # bump — never per-toolchain.
      - run: cargo test --workspace --all-features
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  facade-matrix:
    name: facade ${{ matrix.combo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - "--no-default-features"
          - "--features signals"
          - "--features derive"
          - "--features ui"
          - "--all-features"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 1.98.0
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check -p formars ${{ matrix.combo }}

  wasm32:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 1.98.0
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # The proc-macro crate is excluded (proc-macro crates cannot be built
      # FOR wasm32); consumers targeting wasm MAY still use the derive.
      - run: cargo build --target wasm32-unknown-unknown --workspace --exclude formars-derive
      - run: cargo build --target wasm32-unknown-unknown -p formars --all-features

  msrv:
    name: msrv 1.88 (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 1.88 (msrv)
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # The derive trybuild UI suite is EXCLUDED here: snapshot stderr is
      # rustc-version-sensitive (help-rendering drift between 1.88 and newer
      # toolchains makes the snapshots fail on this job). The pinned gate job
      # is the SOLE snapshot authority; the four functional derive targets
      # below preserve full non-snapshot derive coverage on MSRV.
      - run: cargo check --workspace --all-features
      - run: cargo test --workspace --all-features --exclude formars-derive
      - run: cargo test -p formars-derive --test conformance --test nesting --test parity --test send_sync
