name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Superset of the README battery's test lines: covers
      # `cargo test --workspace`, `cargo test -p formars --all-features`
      # (facade probes/doctests), and the derive trybuild UI suite
      # (dev-dependency, compiled under all-features).
      # NOTE: trybuild snapshot stderr (diagnostic wording, spans, help
      # blocks) is rustc-version-sensitive; snapshots are verified against
      # the floating stable toolchain above — regenerate with
      # `TRYBUILD=overwrite` whenever this job's toolchain moves.
      - run: cargo test --workspace --all-features

  facade-matrix:
    name: facade ${{ matrix.combo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - "--no-default-features"
          - "--features signals"
          - "--features derive"
          - "--features ui"
          - "--all-features"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check -p formars ${{ matrix.combo }}

  wasm32:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # The proc-macro crate is excluded (proc-macro crates cannot be built
      # FOR wasm32); consumers targeting wasm MAY still use the derive.
      - run: cargo build --target wasm32-unknown-unknown --workspace --exclude formars-derive
      - run: cargo build --target wasm32-unknown-unknown -p formars --all-features

  msrv:
    name: msrv 1.88 (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check --workspace --all-features
      - run: cargo test --workspace --all-features
