[package]
name = "forma-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Leptos 0.8 companion crate for forma-signals: use_form hook, <Form> submit wrapper, <TextField>."

[lints]
workspace = true

[dependencies]
forma-signals = { workspace = true }
leptos = { workspace = true }
reactive_graph = { workspace = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
# test-only edge: schema builders are not part of forma-signals' public re-exports;
# the LIBRARY dependency graph still contains no forma-core node.
forma-core = { workspace = true }
