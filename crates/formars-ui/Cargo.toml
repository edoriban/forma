[package]
name = "formars-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Leptos 0.8 companion crate for formars-signals: use_form hook, <Form> submit wrapper, <TextField>."
keywords = ["leptos", "forms", "ui", "components"]
categories = ["gui", "wasm"]
documentation = "https://docs.rs/formars-ui"
readme = "README.md"

[lints]
workspace = true

[dependencies]
formars-signals = { workspace = true }
leptos = { workspace = true }
reactive_graph = { workspace = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
formars-core = { workspace = true }
# test-only edge: schema builders are not part of formars-signals' public
# re-exports; the LIBRARY dependency graph contains no direct formars-core
# node (library code reaches it only transitively via formars-signals).
