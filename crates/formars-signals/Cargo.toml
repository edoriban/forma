[package]
name = "formars-signals"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless reactive form controller on reactive_graph: registry, validation timing, submit boundary, server-error merging."
keywords = ["reactive", "forms", "validation", "signals", "wasm"]
categories = ["rust-patterns", "wasm"]
documentation = "https://docs.rs/formars-signals"
readme = "README.md"

[lints]
workspace = true

[dependencies]
formars-core = { workspace = true }
reactive_graph = { workspace = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
