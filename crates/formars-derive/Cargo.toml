[package]
name = "formars-derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in `#[derive(FormSchema)]` companion for formars-core."
keywords = ["derive", "forms", "schema", "proc-macro"]
categories = ["rust-patterns"]
documentation = "https://docs.rs/formars-derive"
readme = "README.md"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# Generated code references `::formars_core` in the consumer's namespace; the
# macro itself never links it — only the test suite does.
formars-core = { workspace = true }
trybuild = { workspace = true }
