[workspace]
resolver = "3"
members = ["crates/formars", "crates/formars-core", "crates/formars-derive", "crates/formars-signals", "crates/formars-ui"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/edoriban/formars"

[workspace.dependencies]
# path+version registry for the five workspace crates; member manifests
# reference these via `workspace = true`
formars = { path = "crates/formars", version = "0.1.0" }
formars-core = { path = "crates/formars-core", version = "0.1.0" }
formars-derive = { path = "crates/formars-derive", version = "0.1.0" }
formars-signals = { path = "crates/formars-signals", version = "0.1.0" }
formars-ui = { path = "crates/formars-ui", version = "0.1.0" }
reactive_graph = { version = "0.2", default-features = false }
leptos = { version = "0.8", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# conservative allow-list (each deviation gets an inline comment at first use site too):
allow_attributes_without_reason = "warn"
module_name_repetitions = "allow" # types/{string,number,bool}.rs naming is intentional
missing_errors_doc = "allow" # parse()/validate_value() docs cover error cases explicitly
single_match_else = "allow"

[profile.release]
lto = "thin" # wasm-friendly size/perf balance
codegen-units = 1
strip = "debuginfo"
